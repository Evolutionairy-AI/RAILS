[project]
name = "rails-ref"
version = "0.1.0"
description = "Reference implementation and adversarial harness for the RAILS verification-native clearing protocol"
requires-python = ">=3.11"
dependencies = ["numpy", "matplotlib", "anthropic", "openai", "truststore"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rails_ref*"]
